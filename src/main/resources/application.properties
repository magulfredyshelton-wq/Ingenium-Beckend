spring.application.name=ingenium

# ---------- Servidor (o Render define a porta pela variável PORT) ----------
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---------- Segurança (valores vêm de variáveis de ambiente / perfil local) ----------
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ---------- Base de dados (Neon / PostgreSQL) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# ---------- Google OAuth (o client-id é público por design) ----------
google.client-id=604585640136-rkrsrvcekcbrkmng70nlav700qigsq79.apps.googleusercontent.com

# Maximo de participantes por sala (malha P2P: recomendado 4-6)
videocall.max-participants=6

# STUN (descobrir IP publico). Lista separada.
videocall.ice.stun=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302

# TURN (relay) - NECESSARIO quando os participantes estao em redes diferentes
videocall.ice.turn.urls=${TURN_URLS:}
videocall.ice.turn.username=${TURN_USERNAME:}
videocall.ice.turn.credential=${TURN_CREDENTIAL:}

# ---------- Feed ----------
feed.weights.course=3
feed.weights.tag=2
feed.weights.category=1
feed.weights.author=2
feed.weights.recency=5
feed.weights.half-life-hours=48
feed.weights.job-multiplier=1.5
feed.weights.urgency=3
feed.weights.urgency-window-days=7

# ---------- IA (Gemini + pgvector) ----------
spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=180s

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.6-flash}
spring.ai.google.genai.chat.options.temperature=0.4
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

# a tabela é criada pelo Flyway (V16), não pelo Spring AI
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.table-name=ai_vector_store
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# ---------- Configuração do Ingenium ----------
ingenium.ai.nome=Ingenium
ingenium.ai.rag.top-k=6
ingenium.ai.rag.limiar-similaridade=0.55
ingenium.ai.chat.memoria-mensagens=10
ingenium.ai.chat.max-caracteres=4000

# ---------- Armazenamento (Backblaze B2, protocolo S3) ----------
storage.endpoint=https://s3.us-east-005.backblazeb2.com
storage.region=us-east-005

storage.public-bucket.name=Ingenium-public-co-mz
storage.public-bucket.access-key=${B2_PUBLIC_KEY_ID}
storage.public-bucket.secret-key=${B2_PUBLIC_APP_KEY}
storage.public-bucket.base-url=https://s3.us-east-005.backblazeb2.com/Ingenium-public-co-mz

storage.private-bucket.name=Ingenium-private-co-mz
storage.private-bucket.access-key=${B2_PRIVATE_KEY_ID}
storage.private-bucket.secret-key=${B2_PRIVATE_APP_KEY}

# O Spring só aceita 1 MB por omissão; o avatar aceita até 10 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---------- Email ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true